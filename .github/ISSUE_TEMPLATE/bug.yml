name: Export problem / 导出问题
description: Report with synthetic data only / 请勿上传私人资料
body:
  - type: markdown
    attributes:
      value: "Never paste API tokens, real CSV files, signed URLs or customer photos. 请只用虚构示例。"
  - type: textarea
    attributes:
      label: What were you trying to export? / 你想得到什么结果？
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps and actual result / 操作步骤与实际结果
    validations:
      required: true
  - type: input
    attributes:
      label: Operating system, Node version, PhotoPort version

